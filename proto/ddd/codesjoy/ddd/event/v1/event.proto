syntax = "proto3";

package codesjoy.ddd.event.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/codesjoy/pkg/proto/codesjoy/ddd/event/v1;eventv1";

message EventOptions {
  string event_type = 1;
  string topic = 2;
}

extend google.protobuf.MessageOptions {
  EventOptions event = 1110;
}

extend google.protobuf.FieldOptions {
  bool event_id = 1111;
}

extend google.protobuf.FieldOptions {
  bool partition_key = 1112;
}
