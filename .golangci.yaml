# Default profile excludes generated Go files.
# Use INCLUDE_GENERATED=1 in make targets to include generated files.
version: "2"

linters:
  default: none
  enable:
    # basic checks
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

    # style
    - revive
    - unconvert
    - gocritic

    # security
    - gosec

    # concurrency
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G115
    revive:
      rules:
        # Enforce GoDoc comments for exported identifiers.
        - name: exported
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: strict
    paths:
      - '(^|/).*\.pb\.go$'
      - '(^|/).*\.pb\.gw\.go$'
      - '(^|/).*\.gen\.go$'
      - '(^|/).*_gen\.go$'
      - '(^|/).*_generated\.go$'
      - '(^|/)zz_generated.*\.go$'
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx
      # Don't require GoDoc comments in *_test.go.
      - path: _test\.go
        linters:
          - revive
        text: "exported (.+) should have comment"
      - path: _test\.go
        linters:
          - gosec
        text: "G402:"
      - path: _test\.go
        linters:
          - gosec
        text: "G104:"
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter:"
      - path: example/
        linters:
          - revive
        text: "unused-parameter:"
      - path: example/
        linters:
          - errcheck
          - noctx
          - unused

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: strict
    paths:
      - '(^|/).*\.pb\.go$'
      - '(^|/).*\.pb\.gw\.go$'
      - '(^|/).*\.gen\.go$'
      - '(^|/).*_gen\.go$'
      - '(^|/).*_generated\.go$'
      - '(^|/)zz_generated.*\.go$'
