include_tables:
  - users
gen_aipsql: true
timestamp_mode: unix_nano

tables:
  users:
    model_name: User
    aipsql_builder: NewUserAIPTable
    gen_aipsql: true
    timestamp_mode: unix_nano
    columns:
      name:
        match_modes: [exact, prefix]
      is_active:
        bool_type: true
        filterable: true
        sortable: true
      update:
        go_field: UpdatedAt
      deleted_at:
        filterable: true
