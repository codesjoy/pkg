services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: modelgen_it
      POSTGRES_USER: modelgen
      POSTGRES_PASSWORD: modelgen
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgen -d modelgen_it"]
      interval: 2s
      timeout: 2s
      retries: 15
