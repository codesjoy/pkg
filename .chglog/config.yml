style: github
template: .chglog/CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/codesjoy/pkg
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - docs
        - style
        - refactor
        - perf
        - test
        - build
        - ci
        - chore
        - revert
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      docs: Documentation
      style: Styles
      refactor: Refactors
      perf: Performance Improvements
      test: Tests
      build: Build System
      ci: CI
      chore: Chores
      revert: Reverts
  header:
    pattern: "^([[:alnum:]]+)(?:\\(([[:alnum:]_./\\-\\s]+)\\))?(!)?:\\s(.+)$"
    pattern_maps:
      - Type
      - Scope
      - Breaking
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
